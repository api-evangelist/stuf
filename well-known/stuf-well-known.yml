description: >-
  Results of probing the /.well-known/ discovery surface for every host Stuf
  Storage operates. Stuf publishes no API and therefore no apis[].baseURL or
  OpenAPI servers[] host exists; the hosts probed are the marketing/booking site
  (www.stufstorage.com and the apex stufstorage.com), the Zendesk-hosted member
  help center, and the two Sanity/Webflow-style content subdomains named in the
